[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hk-sportfinder"
version = "0.1.0"
description = "Hong Kong sports venue map and AI selection assistant"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28,<1",
  "fastapi==0.159.1",
  "uvicorn[standard]==0.54.0",
  "openai-agents==0.24.0",
  "mcp>=2.3,<3",
  "python-dotenv>=1.0,<2",
  "Pillow>=11,<13",
  "redis>=5,<8",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "fakeredis>=2.26,<3"]

[tool.setuptools.packages.find]
include = ["backend*", "agent*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]

[tool.setuptools.package-data]
"backend.app.data" = ["booking_sources.json"]
